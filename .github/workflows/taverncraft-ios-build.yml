name: Build TavernCraft Launcher iOS (.ipa / .tipa)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build TavernCraft iOS (Java 21 + Cobblemon Controls)
    runs-on: macos-15-intel

    steps:
      - name: Checkout TavernLauncher-iOS (with MobileGlues & submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup JDK 8 (BOOTJDK for Pojav JavaApp bridge)
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '8'

      - name: Install build tools (gmake, cmake, ldid)
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_UPGRADE: "1"
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"
        run: |
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          ARCH="$(uname -m)"
          if [ "$ARCH" = "arm64" ]; then
            LDID_URL="https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus8/ldid_macosx_arm64"
          else
            LDID_URL="https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus8/ldid_macosx_x86_64"
          fi
          curl -fSL "$LDID_URL" -o /usr/local/bin/ldid
          chmod +x /usr/local/bin/ldid
          command -v cmake >/dev/null 2>&1 || brew install cmake
          command -v gmake >/dev/null 2>&1 || brew install make
          which gmake cmake ldid
          "$JAVA_HOME/bin/javac" -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Build TavernCraft iOS (.ipa for SideStore/AltStore + .tipa for TrollStore)
        env:
          TAVERN_JRE21_ONLY: "1"
          RELEASE: "1"
        run: |
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          export BOOTJDK="$JAVA_HOME/bin"
          gmake -j$(sysctl -n hw.ncpu) package PLATFORM=2 BOOTJDK="$BOOTJDK" RELEASE=1 TAVERN_JRE21_ONLY=1
          gmake -j$(sysctl -n hw.ncpu) package PLATFORM=2 BOOTJDK="$BOOTJDK" RELEASE=1 TAVERN_JRE21_ONLY=1 TROLLSTORE_JIT_ENT=1
          ls -lh artifacts/

      - name: Upload TavernCraftLauncher iOS (.ipa)
        uses: actions/upload-artifact@v4
        with:
          name: TavernCraftLauncher-iOS-ipa
          path: artifacts/TavernCraftLauncher-*-ios.ipa

      - name: Upload TavernCraftLauncher iOS TrollStore (.tipa)
        uses: actions/upload-artifact@v4
        with:
          name: TavernCraftLauncher-iOS-trollstore-tipa
          path: artifacts/TavernCraftLauncher-*-ios-trollstore.tipa
